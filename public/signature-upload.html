<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Upload Tanda Tangan — RCL Maker</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f4f6; color: #111827; }
    main { width: min(92vw, 480px); box-sizing: border-box; background: white; border-radius: 18px; padding: 24px; box-shadow: 0 12px 36px #0001; }
    h1 { margin-top: 0; font-size: 1.45rem; }
    p { color: #4b5563; line-height: 1.55; }
    input, button { width: 100%; box-sizing: border-box; margin-top: 14px; }
    input { padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; }
    button { padding: 13px; border: 0; border-radius: 10px; background: #2563eb; color: white; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { margin-top: 16px; padding: 12px; border-radius: 10px; display: none; white-space: pre-wrap; }
    #status.ok { display: block; background: #dcfce7; color: #166534; }
    #status.error { display: block; background: #fee2e2; color: #991b1b; }
    #preview { max-width: 100%; max-height: 180px; object-fit: contain; display: none; margin: 14px auto 0; background: #f9fafb; border: 1px dashed #d1d5db; border-radius: 10px; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f9fafb; }
      main { background: #1f2937; }
      p { color: #d1d5db; }
      input { border-color: #4b5563; background: #111827; color: white; }
      #preview { background: #111827; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Upload Tanda Tangan</h1>
    <p>Pilih gambar tanda tangan PNG atau JPEG. Tautan ini bersifat privat, hanya berlaku satu kali, dan kedaluwarsa dalam 15 menit.</p>
    <form id="upload-form">
      <input id="signature-file" type="file" accept="image/png,image/jpeg" required>
      <img id="preview" alt="Preview tanda tangan">
      <button id="upload-button" type="submit">Upload Tanda Tangan</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    const form = document.getElementById('upload-form');
    const input = document.getElementById('signature-file');
    const button = document.getElementById('upload-button');
    const statusBox = document.getElementById('status');
    const preview = document.getElementById('preview');

    function showStatus(message, kind) {
      statusBox.textContent = message;
      statusBox.className = kind;
    }

    input.addEventListener('change', () => {
      const file = input.files?.[0];
      if (!file) return;
      if (!['image/png', 'image/jpeg'].includes(file.type) || file.size > 512 * 1024) {
        preview.style.display = 'none';
        showStatus('Pilih PNG/JPEG dengan ukuran maksimal 512 KB.', 'error');
        return;
      }
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      statusBox.style.display = 'none';
      statusBox.className = '';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const file = input.files?.[0];
      if (!token) return showStatus('Token upload tidak ditemukan. Minta tautan baru dari Claude.', 'error');
      if (!file) return showStatus('Pilih gambar tanda tangan terlebih dahulu.', 'error');
      if (!['image/png', 'image/jpeg'].includes(file.type) || file.size > 512 * 1024) {
        return showStatus('Pilih PNG/JPEG dengan ukuran maksimal 512 KB.', 'error');
      }

      button.disabled = true;
      button.textContent = 'Mengunggah...';
      try {
        const response = await fetch(`/api/signature-upload/${encodeURIComponent(token)}`, {
          method: 'POST',
          headers: { 'Content-Type': file.type },
          body: file,
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || `Upload gagal (HTTP ${response.status}).`);
        showStatus(`Berhasil! Tanda tangan tersimpan untuk profil: ${result.profileName}. Kembali ke Claude dan ketik /cek-ttd.`, 'ok');
        input.disabled = true;
        button.textContent = 'Upload Berhasil';
        history.replaceState({}, '', location.pathname);
      } catch (error) {
        showStatus(error.message || 'Upload gagal. Minta tautan baru dari Claude.', 'error');
        button.disabled = false;
        button.textContent = 'Coba Upload Lagi';
      }
    });
  </script>
</body>
</html>
